name: Aplicar mejora eliminar trabajos duplicados

on:
  push:
    paths:
      - '.github/workflows/bbmoon-delete-trabajo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Agregar eliminacion segura de trabajos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = r'''      '<button class="btn gold" onclick="abrirPago(\''+esc(id)+'\',\''+esc(t.id_cliente)+'\')">💰 Registrar pago</button>'+
              '</div>';
          }
          function cambiarEstadoTrabajo(id, estado){'''

          new = r'''      '<button class="btn gold" onclick="abrirPago(\''+esc(id)+'\',\''+esc(t.id_cliente)+'\')">💰 Registrar pago</button>'+
              '<button class="btn secondary" style="margin-top:10px;color:#B23A48;" onclick="eliminarTrabajo(\''+esc(id)+'\')">🗑 Eliminar trabajo</button>'+
              '</div>';
          }
          function eliminarTrabajo(id){
            var t=STATE.trabajos.find(function(x){return String(x.id_trabajo)===String(id);});
            var nombre=(t&&t.titulo_trabajo)?t.titulo_trabajo:'este trabajo';
            if(!confirm('¿Eliminar '+nombre+'?\n\nSe borrará también cualquier pago asociado y no se puede deshacer.')) return;
            showSaving('Eliminando…');
            api('deleteTrabajo',{id_trabajo:id})
              .then(function(){ return reloadData(); })
              .then(function(){ toast('Trabajo eliminado','ok'); go('trabajos'); })
              .catch(apiErr);
          }
          function cambiarEstadoTrabajo(id, estado){'''

          for filename in ('index.html', 'frontend/index.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'No se encontro el bloque esperado exactamente una vez en {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/bbmoon-delete-trabajo.yml').unlink()
          PY

      - name: Verificar cambio
        shell: bash
        run: |
          grep -q "function eliminarTrabajo(id)" index.html
          grep -q "function eliminarTrabajo(id)" frontend/index.html
          grep -q "Eliminar trabajo" index.html
          grep -q "Eliminar trabajo" frontend/index.html

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Permitir eliminar trabajos duplicados"
          git push

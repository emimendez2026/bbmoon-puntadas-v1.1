name: Disparar interfaz de escritorio

on:
  push:
    paths:
      - '.github/workflows/trigger-desktop.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activar workflow responsive
        run: |
          printf '\n# activacion responsive\n' >> .github/workflows/bbmoon-desktop-responsive.yml
          rm .github/workflows/trigger-desktop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activar cambio responsive de escritorio"
          git push
